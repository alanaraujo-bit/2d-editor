name: Sugerir uma melhoria
description: Uma ideia para deixar o 2D Editor ainda melhor
labels: ["sugestão"]
body:
  - type: textarea
    id: ideia
    attributes:
      label: Qual é a sua ideia?
      description: Conte o que você gostaria que o 2D Editor fizesse.
    validations:
      required: true
  - type: textarea
    id: porque
    attributes:
      label: Por que isso ajudaria?
      description: Em que situação do seu dia a dia isso faria diferença?
